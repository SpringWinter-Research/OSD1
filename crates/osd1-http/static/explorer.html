    // SQLite accepts any type name. This matches a type-name: words, then an optional length.
    const TYPE_NAME = /^[A-Za-z_][A-Za-z0-9_]*(?:\s+[A-Za-z_][A-Za-z0-9_]*){0,5}(?:\(\s*\d+\s*(?:,\s*\d+\s*)?\))?$/;

      "SELECT m.name, i.cid, i.name, i.type, i.pk, i.dflt_value FROM sqlite_master AS m " +
      "JOIN pragma_table_info(m.name) AS i WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%' " +
      "ORDER BY m.name, i.cid; " +
      "SELECT m.name, f.id, f.seq, f.\"from\", f.\"table\", f.\"to\", f.on_update, f.on_delete " +
      "FROM sqlite_master AS m JOIN pragma_foreign_key_list(m.name) AS f " +

      root.dataset.bound = "1";
      Object.defineProperty(root, "value", {
        configurable: true,
        get: function () { return root.dataset.value || ""; },
        set: function (next) { applyPickerValue(root, next, false); },
      });
      const trigger = root.querySelector("[data-slot='select-trigger']");
      trigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        const open = root.getAttribute("data-state") === "open";
        closeTypeMenus();
        closePickers();
        if (!open) {
          const content = root.querySelector("[data-slot='select-content']");
          const rect = trigger.getBoundingClientRect();
          content.style.position = "fixed";
          content.style.top = (rect.bottom + 4) + "px";
          content.style.left = rect.left + "px";
          content.style.width = rect.width + "px";
          root.setAttribute("data-state", "open");
          trigger.setAttribute("aria-expanded", "true");
          trigger.setAttribute("data-state", "open");
          content.hidden = false;
        }
      });
      return root;
    }

    function closePickers() {
      document.querySelectorAll("[data-slot='select'][data-state='open']").forEach(function (root) {
        root.setAttribute("data-state", "closed");
        const trigger = root.querySelector("[data-slot='select-trigger']");
        if (trigger) {
          trigger.setAttribute("aria-expanded", "false");
          trigger.setAttribute("data-state", "closed");
        }
        const content = root.querySelector("[data-slot='select-content']");
        if (content) content.hidden = true;
      });
    }

    function closeTypeMenus(except) {
      document.querySelectorAll("[data-slot='combobox'][data-state='open']").forEach(function (root) {
        if (except && root === except) return;
        root.setAttribute("data-state", "closed");
        const content = root.querySelector("[data-slot='combobox-content']");
        if (content) content.hidden = true;
        const trigger = root.querySelector("[data-slot='combobox-trigger']");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
        const input = root.querySelector(".col-type");
        if (input) input.setAttribute("aria-expanded", "false");
      });
    }

    function bindTypeField(root) {
      if (!root || root.dataset.bound === "1") return;
      root.dataset.bound = "1";
      const input = root.querySelector(".col-type");
      const trigger = root.querySelector("[data-slot='combobox-trigger']");
      const content = root.querySelector("[data-slot='combobox-content']");
      const empty = content.querySelector("[data-slot='combobox-empty']");

      function visibleItems() {
        return Array.prototype.filter.call(content.querySelectorAll("[data-slot='combobox-item']"), function (item) {
          return !item.hidden;
        });
      }

      content.querySelectorAll("[data-slot='combobox-item']").forEach(function (item) {
        item.setAttribute("role", "option");
        const mark = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        mark.setAttribute("viewBox", "0 0 24 24");
        mark.setAttribute("fill", "none");
        mark.setAttribute("stroke", "currentColor");
        mark.setAttribute("stroke-width", "2");
        mark.setAttribute("stroke-linecap", "round");
        mark.setAttribute("stroke-linejoin", "round");
        mark.setAttribute("data-slot", "combobox-item-indicator");
        mark.setAttribute("aria-hidden", "true");
        mark.setAttribute("class", "ml-auto size-4");
        mark.style.marginLeft = "auto";
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M20 6 9 17l-5-5");
        mark.append(path);
        item.append(mark);
      });

      function paint() {
        const current = input.value.trim();
        content.querySelectorAll("[data-slot='combobox-item']").forEach(function (item) {
          const on = item.dataset.value === current;
          item.setAttribute("data-state", on ? "checked" : "unchecked");
          item.setAttribute("aria-selected", on ? "true" : "false");
          const mark = item.querySelector("[data-slot='combobox-item-indicator']");
          if (mark) mark.style.opacity = on ? "1" : "0";
        });
      }

      function applyFilter(query) {
        const q = String(query || "").trim().toUpperCase();
        let any = false;
        content.querySelectorAll("[data-slot='combobox-group']").forEach(function (group) {
          let count = 0;
          group.querySelectorAll("[data-slot='combobox-item']").forEach(function (item) {
            const show = !q || item.dataset.value.toUpperCase().indexOf(q) !== -1;
            item.hidden = !show;
            if (show) count += 1;
          });
          group.hidden = count === 0;
          if (count) any = true;
        });
        if (empty) empty.hidden = any;
        paint();
      }

      function highlighted() {
        return content.querySelector("[data-slot='combobox-item'][data-highlighted]");
      }

      function move(delta) {
        const items = visibleItems();
        if (!items.length) return;
        let index = items.indexOf(highlighted());
        index = index === -1 ? (delta > 0 ? 0 : items.length - 1) : (index + delta + items.length) % items.length;
        items.forEach(function (item) { item.removeAttribute("data-highlighted"); });
        items[index].setAttribute("data-highlighted", "");
        reveal(items[index]);
      }

      function reveal(item) {
        const top = item.offsetTop;
        const bottom = top + item.offsetHeight;
        if (top < content.scrollTop) content.scrollTop = top;
        else if (bottom > content.scrollTop + content.clientHeight) content.scrollTop = bottom - content.clientHeight;
      }

      function place() {
        const rect = root.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom;
        const spaceAbove = rect.top;
        const openUp = spaceBelow < 280 && spaceAbove > spaceBelow;
        const room = Math.max(160, Math.min((openUp ? spaceAbove : spaceBelow) - 12, 384));
        content.style.position = "fixed";
        content.style.left = rect.left + "px";
        content.style.width = Math.max(rect.width, 220) + "px";
        content.style.maxHeight = room + "px";
        content.style.overscrollBehavior = "contain";
        if (openUp) {
          content.style.top = "auto";
          content.style.bottom = (window.innerHeight - rect.top + 4) + "px";
        } else {
          content.style.bottom = "auto";
          content.style.top = (rect.bottom + 4) + "px";
        }
      }

      function open(filter) {
        closePickers();
        closeTypeMenus(root);
        applyFilter(filter ? input.value : "");
        place();
        content.hidden = false;
        root.setAttribute("data-state", "open");
        trigger.setAttribute("aria-expanded", "true");
        input.setAttribute("aria-expanded", "true");
        content.querySelectorAll("[data-highlighted]").forEach(function (item) {
          item.removeAttribute("data-highlighted");
        });
        const chosen = content.querySelector("[data-slot='combobox-item'][data-state='checked']:not([hidden])");
        const target = chosen || visibleItems()[0];
        if (target) {
          target.setAttribute("data-highlighted", "");
          reveal(target);
        }
      }

      function close() {
        content.hidden = true;
        root.setAttribute("data-state", "closed");
        trigger.setAttribute("aria-expanded", "false");
        input.setAttribute("aria-expanded", "false");
      }

      trigger.addEventListener("mousedown", function (event) {
        event.preventDefault();
      });
      trigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (root.getAttribute("data-state") === "open") close();
        else open(false);
      });
      content.addEventListener("mousedown", function (event) {
        event.preventDefault();
      });
      content.addEventListener("click", function (event) {
        const item = event.target.closest("[data-slot='combobox-item']");
        if (!item) return;
        event.preventDefault();
        event.stopPropagation();
        input.value = item.dataset.value;
        close();
        input.focus();
      });
      input.addEventListener("focus", function () {
        if (root.getAttribute("data-state") !== "open") open(false);
      });
      input.addEventListener("input", function () {
        open(true);
      });
      input.addEventListener("keydown", function (event) {
        const openNow = root.getAttribute("data-state") === "open";
        if (event.key === "Escape" && openNow) {
          event.preventDefault();
          event.stopPropagation();
          close();
          return;
        }
        if (event.key === "ArrowDown") {
          event.preventDefault();
          if (!openNow) open(true);
          else move(1);
          return;
        }
        if (event.key === "ArrowUp" && openNow) {
          event.preventDefault();
          move(-1);
          return;
        }
        if (event.key === "Enter" && openNow) {
          event.preventDefault();
          const item = highlighted();
          if (item) input.value = item.dataset.value;
          close();
        }
      });
    }

    function applyPickerValue(root, value, notify) {
      root.dataset.value = value || "";
      const label = root.querySelector("[data-slot='select-value']");
      const items = root.querySelectorAll("[data-slot='select-item']");
      let text = "";
      items.forEach(function (item) {
        const on = item.dataset.value === root.dataset.value;
        item.setAttribute("data-state", on ? "checked" : "unchecked");
        item.setAttribute("aria-selected", on ? "true" : "false");
        if (on) text = item.textContent;
      });
      if (label) label.textContent = text || value || "Select";
      const trigger = root.querySelector("[data-slot='select-trigger']");
      if (trigger) {
        if (text || value) trigger.removeAttribute("data-placeholder");
        else trigger.setAttribute("data-placeholder", "");
      }
      if (notify) root.dispatchEvent(new Event("change"));
    }

    function setPickerOptions(root, options, preferred) {
      bindPicker(root);
      const content = root.querySelector("[data-slot='select-content']");
      content.replaceChildren();
      options.forEach(function (option) {
        const item = document.createElement("button");
        item.type = "button";
        item.dataset.slot = "select-item";
        item.dataset.value = option.value;
        item.className = SELECT_ITEM;
        item.setAttribute("role", "option");
        item.textContent = option.label;
        item.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          applyPickerValue(root, option.value, true);
          closePickers();
        });
        content.append(item);
      });
      const keep = preferred && options.some(function (option) { return option.value === preferred; });
      applyPickerValue(root, keep ? preferred : (options[0] ? options[0].value : ""), false);
    }

    function storageGet(key) {
      try { return sessionStorage.getItem(key); } catch (err) { return null; }
    }

    function storageSet(key, value) {
      try { sessionStorage.setItem(key, value); } catch (err) { /* this tab can still continue */ }
    }

    function storageRemove(key) {
      try { sessionStorage.removeItem(key); } catch (err) { /* ignore */ }
    }

    function setLoginError(message) {
      const el = document.getElementById("login-error");
      el.textContent = message || "";
      el.hidden = !message;
    }

    function setError(message) {
      const el = document.getElementById("banner");
      el.textContent = message || "";
      el.hidden = !message;
    }

    function setStatus(message) {
      const el = document.getElementById("status");
      el.textContent = message || "";
      el.hidden = !message;
    }

    function showLogin() {
      document.getElementById("app").hidden = true;
      document.getElementById("login").hidden = false;
    }

    function showApp() {
      document.getElementById("login").hidden = true;
      document.getElementById("app").hidden = false;
    }

    function handleError(err) {
      const unreachable = err instanceof TypeError;
      const message = unreachable ? "Could not reach the server." : (err.message || "Request failed.");
      if (err.status === 401 || document.getElementById("app").hidden) {
        storageRemove("osd1.signedIn");
        showLogin();
        setLoginError(err.status === 401 ? "That token was rejected." : message);
        return;
      }
      setError(message);
    }

    async function withBusy(fn) {
      if (state.busy) return;
      state.busy = true;
      document.body.dataset.busy = "1";
      setError("");
      try {
        await fn();
      } catch (err) {
        handleError(err);
      } finally {
        state.busy = false;
        delete document.body.dataset.busy;
        setStatus("");
      }
    }

    function renderBadge() {
      const badge = document.getElementById("badge");
      if (state.primary === null) {
        badge.hidden = true;
        return;
      }
      badge.hidden = false;
      badge.textContent = state.primary ? "primary" : "follower";
    }

    async function raw(sql, params) {
      const headers = { "content-type": "application/json" };
      if (state.token) headers.Authorization = "Bearer " + state.token;
      let response;
      try {
        response = await fetch(RAW, {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ sql: sql, params: params || [] }),
        });
      } catch (err) {
        const failure = new Error("Could not reach the server.");
        failure.cause = err;
        throw failure;
      }
      const text = await response.text();
      let body = null;
      if (text) {
        try { body = JSON.parse(text); } catch (err) { body = null; }
      }
      if (response.status === 401) {
        const failure = new Error("That token was rejected.");
        failure.status = 401;
        throw failure;
      }
      if (!response.ok || !body || body.success === false) {
        const api = body && body.errors && body.errors[0] && body.errors[0].message;
        const failure = new Error(api || ("Request failed (" + response.status + ")."));
        failure.status = response.status;
        throw failure;
      }
      const statements = body.result || [];
      for (let i = 0; i < statements.length; i++) {
        const meta = statements[i].meta;
        if (meta && typeof meta.served_by_primary === "boolean") {
          state.primary = meta.served_by_primary;
        }
      }
      renderBadge();
      return statements;
    }

    function quoteIdent(name) {
      return '"' + String(name).replaceAll('"', '""') + '"';
    }

    function userIdent(value) {
      if (!IDENT.test(value)) {
        throw new Error("Use a letter or underscore, then letters, digits, or underscores.");
      }
      return '"' + value + '"';
    }

    function sqlString(value) {
      return "'" + String(value).replaceAll("'", "''") + "'";
    }

    function columnType(value) {
      const type = String(value || "").trim().replace(/\s+/g, " ");
      if (!type) return "";
      if (!TYPE_NAME.test(type)) {
        throw new Error("Use a SQLite type name, such as INTEGER, VARCHAR(255), or DECIMAL(10, 2).");
      }
      return type;
    }

    function current() {
      for (let i = 0; i < state.tables.length; i++) {
        if (state.tables[i].name === state.selected) return state.tables[i];
      }
      return null;
    }

    function bindValue(text, type) {
      if (text === "") return null;
      const kind = String(type || "").toUpperCase();
      const numeric = /^-?(0|[1-9]\d*)(\.\d+)?$/.test(text);
      if (kind.indexOf("INT") !== -1 && kind.indexOf("INTERVAL") === -1) {
        if (/^-?(0|[1-9]\d{0,14})$/.test(text)) {
          const number = Number(text);
          if (Number.isSafeInteger(number)) return number;
        }
        return text;
      }
      if (
        kind.indexOf("REAL") !== -1 ||
        kind.indexOf("FLOA") !== -1 ||
        kind.indexOf("DOUB") !== -1 ||
        kind.indexOf("NUM") !== -1 ||
        kind.indexOf("DEC") !== -1 ||
        kind === "BOOLEAN"
      ) {
        if (numeric) {
          const number = Number(text);
          if (Number.isFinite(number)) return number;
        }
      }
      return text;
    }

    function cellValue(value) {
      if (value === null || value === undefined) return null;
      if (typeof value === "string" || typeof value === "number") return String(value);
      return JSON.stringify(value);
    }

    function grid(columns, rows, options) {
      const skip = options && options.skip;
      const table = document.createElement("table");
      table.dataset.slot = "table";
      table.className = "w-full caption-bottom text-sm";
      const thead = document.createElement("thead");
      thead.dataset.slot = "table-header";
      thead.className = "[&_tr]:border-b";
      const headRow = document.createElement("tr");
      headRow.dataset.slot = "table-row";
      headRow.className = "border-b";
      columns.forEach(function (column, index) {
        if (skip && skip.has(index)) return;
        const th = document.createElement("th");
        th.dataset.slot = "table-head";
        th.className = TH;
        th.scope = "col";
        th.textContent = column;
        headRow.append(th);
      });
      if (options && options.onDelete) {
        const th = document.createElement("th");
        th.dataset.slot = "table-head";
        th.className = TH;
        th.scope = "col";
        const span = document.createElement("span");
        span.className = "sr-only";
        span.textContent = "Delete";
        th.append(span);
        headRow.append(th);
      }
      thead.append(headRow);
      const tbody = document.createElement("tbody");
      tbody.dataset.slot = "table-body";
      tbody.className = "[&_tr:last-child]:border-0";
      if (!rows.length) {
        const tr = document.createElement("tr");
        tr.dataset.slot = "table-row";
        tr.className = TR;
        const td = document.createElement("td");
        let visible = 0;
        columns.forEach(function (_, index) {
          if (!(skip && skip.has(index))) visible += 1;
        });
        if (options && options.onDelete) visible += 1;
        td.colSpan = Math.max(visible, 1);
        td.dataset.slot = "table-cell";
        td.className = TD + " text-muted-foreground";
        td.textContent = "No rows.";
        tr.append(td);
        tbody.append(tr);
      }
      rows.forEach(function (row, rowIndex) {
        const tr = document.createElement("tr");
        tr.dataset.slot = "table-row";
        tr.className = TR;
        row.forEach(function (value, index) {
          if (skip && skip.has(index)) return;
          const td = document.createElement("td");
          td.dataset.slot = "table-cell";
          const text = cellValue(value);
          if (text === null) {
            td.className = TD + " text-muted-foreground";
            td.textContent = "NULL";
          } else {
            td.className = typeof value === "number" ? TD + " text-right font-mono tabular-nums" : TD;
            td.textContent = text;
          }
          tr.append(td);
        });
        if (options && options.onDelete) {
          const td = document.createElement("td");
          td.dataset.slot = "table-cell";
          td.className = TD;
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.slot = "button";
          button.dataset.variant = "ghost";
          button.dataset.size = "sm";
          button.className = buttonClass("ghost", "sm") + " text-destructive hover:bg-destructive/10 hover:text-destructive";
          button.textContent = "Delete";
          button.addEventListener("click", function () { options.onDelete(rowIndex); });
          td.append(button);
          tr.append(td);
        }
        tbody.append(tr);
      });
      table.append(thead, tbody);
      const wrap = document.createElement("div");
      wrap.dataset.slot = "table-container";
      wrap.className = "relative w-full overflow-x-auto rounded-xl border bg-card text-card-foreground shadow-sm";
      wrap.append(table);
      return wrap;
    }

    function renderTableList() {
      const list = document.getElementById("table-list");
      list.replaceChildren();
      if (!state.tables.length) {
        const item = document.createElement("li");
        item.dataset.slot = "sidebar-menu-item";
        const note = document.createElement("p");
        note.className = "px-2 text-sm text-muted-foreground";
        note.textContent = "No tables yet.";
        item.append(note);
        list.append(item);
        return;
      }
      state.tables.forEach(function (table) {
        const item = document.createElement("li");
        item.dataset.slot = "sidebar-menu-item";
        item.className = "group/menu-item relative";
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.slot = "sidebar-menu-button";
        button.dataset.sidebar = "menu-button";
        button.dataset.size = "default";
        button.className = MENU_BUTTON;
        button.setAttribute("data-name", table.name);
        const active = table.name === state.selected && state.mode !== "create" && state.mode !== "index" && state.mode !== "sql" && state.mode !== "graph";
        button.dataset.active = active ? "true" : "false";
        if (active) button.setAttribute("aria-current", "true");
        const name = document.createElement("span");
        name.className = "min-w-0 flex-1 truncate font-mono";
        name.textContent = table.name;
        button.append(name);
        if (table.type === "view") {

          kind.textContent = "view";

        list.append(item);

    function setMode(mode) {
      state.mode = mode;
      const table = current();
      const isTable = table && table.type === "table";
      document.getElementById("panel-empty").hidden = mode !== "empty";
      document.getElementById("panel-create").hidden = mode !== "create";
      document.getElementById("panel-index").hidden = mode !== "index";
      document.getElementById("panel-table").hidden = mode !== "rows" && mode !== "structure";
      document.getElementById("panel-sql").hidden = mode !== "sql";
      document.getElementById("panel-graph").hidden = mode !== "graph";
      document.getElementById("grid-wrap").hidden = mode !== "rows";
      document.getElementById("pager").hidden = mode !== "rows";
      document.getElementById("insert-form").hidden = mode !== "rows" || !isTable;
      document.getElementById("structure").hidden = mode !== "structure";
      document.getElementById("sql-tab").setAttribute("data-state", mode === "sql" ? "active" : "inactive");
      document.getElementById("graph-tab").setAttribute("data-state", mode === "graph" ? "active" : "inactive");
      document.getElementById("show-rows").setAttribute("data-state", mode === "rows" ? "active" : "inactive");
      document.getElementById("show-structure").setAttribute("data-state", mode === "structure" ? "active" : "inactive");
      paintButton("new-table", mode === "create" ? "default" : "outline", "sm");
      paintButton("new-index", mode === "index" ? "default" : "outline", "sm");
      renderTableList();
    }

    async function loadTables() {
      const statements = await raw(CATALOG, []);
      const rows = statements[0] && statements[0].results && statements[0].results.rows || [];
      state.tables = rows.map(function (row) {
        return { name: String(row[0]), type: String(row[1]) };
      });
      if (state.selected && !current()) {
        state.selected = null;
        setMode("empty");
      } else {
        renderTableList();
      }
    }

    async function fetchColumns(name) {
      const statements = await raw("PRAGMA table_info(" + quoteIdent(name) + ")", []);
      const rows = statements[0] && statements[0].results && statements[0].results.rows || [];
      return rows.map(function (row) {
        return {
          name: row[1] == null ? "" : String(row[1]),
          type: row[2] == null ? "" : String(row[2]),
          notnull: Number(row[3]) === 1,
          dflt: row[4],
          pk: Number(row[5]) === 1,
        };
      });
    }

    async function fetchPage(name, offset) {
      const quoted = quoteIdent(name);
      let hasRowid = true;
      let statements;
      try {
        statements = await raw(
          "SELECT rowid AS __osd1_rowid, * FROM " + quoted + " LIMIT ? OFFSET ?",
          [PAGE, offset]
        );
      } catch (err) {
        if (!/rowid/i.test(err.message || "")) throw err;
        hasRowid = false;
        statements = await raw(
          "SELECT * FROM " + quoted + " LIMIT ? OFFSET ?",
          [PAGE, offset]
        );
      }
      const results = statements[0].results || { columns: [], rows: [] };
      let total = null;
      try {
        const count = await raw("SELECT COUNT(*) AS n FROM " + quoted, []);
        total = count[0].results.rows[0][0];
      } catch (err) {
        total = null;
      }
      return {
        columns: results.columns || [],
        rows: results.rows || [],
        hasRowid: hasRowid,
        total: total,
      };
    }

    function renderInsert() {
      const form = document.getElementById("insert-form");
      form.replaceChildren();
      const table = current();
      if (!table || table.type !== "table" || !state.columns.length) return;
      state.columns.forEach(function (column) {
        const label = document.createElement("label");
        label.className = "grid gap-2";
        const span = document.createElement("span");
        const bits = [column.name];
        if (column.type) bits.push(column.type);
        if (column.pk) bits.push("primary key");
        if (column.notnull) bits.push("required");
        span.dataset.slot = "label";
        span.className = "text-sm leading-none font-medium";

        input.autocomplete = "off";
        input.spellcheck = false;
        input.dataset.type = column.type;
        input.setAttribute("aria-label", column.name);
        label.append(span, input);
        form.append(label);
      });
      const actions = document.createElement("div");
      actions.className = "flex flex-wrap items-center gap-2";

      button.dataset.slot = "button";
      button.dataset.variant = "default";
      button.dataset.size = "default";
      button.className = buttonClass("default");
      button.type = "submit";
      button.textContent = "Insert row";

      form.append(actions);
    }

    function renderStructure() {

      host.replaceChildren();
      const columns = ["name", "type", "required", "default", "primary key"];
      const rows = state.columns.map(function (column) {
        return [
          column.name,
          column.type,
          column.notnull ? "yes" : "no",
          column.dflt == null ? null : column.dflt,
          column.pk ? "yes" : "no",
        ];

        });

        state.indexes.forEach(function (index) {

          if (index.origin === "pk") bits.push("primary key");
          else if (index.origin === "u") bits.push("unique constraint");
          else if (index.unique) bits.push("unique");
          if (index.partial) bits.push("partial");
          notes.textContent = bits.join(", ");
          tr.append(name, cols, notes);

          action.dataset.slot = "table-cell";
          action.className = TD;

            button.dataset.slot = "button";
            button.dataset.variant = "ghost";
            button.dataset.size = "sm";
            button.className = buttonClass("ghost", "sm") + " text-destructive hover:bg-destructive/10 hover:text-destructive";
            button.textContent = "Drop";
            button.addEventListener("click", function () { dropIndex(index.name); });
            action.append(button);
          }
          tr.append(action);
          tbody.append(tr);
        });
        indexTable.append(thead, tbody);
        const wrap = document.createElement("div");
        wrap.dataset.slot = "table-container";
        wrap.className = "relative w-full overflow-x-auto rounded-xl border bg-card text-card-foreground shadow-sm";
        wrap.append(indexTable);
        host.append(wrap);
      }
      const create = document.createElement("button");
      create.type = "button";
      create.dataset.slot = "button";
      create.dataset.variant = "outline";
      create.dataset.size = "default";
      create.className = buttonClass("outline") + " mt-4";
      create.textContent = "New index";
      create.addEventListener("click", function () {
        withBusy(function () { return openIndex(table.name); });

    async function fetchIndexes(name) {
      const sql = "SELECT il.name AS name, il.\"unique\" AS is_unique, il.origin AS origin, il.partial AS partial, " +
        "(SELECT group_concat(label, ', ') FROM (" +
        "SELECT CASE WHEN ii.name IS NULL THEN '(expression)' WHEN ii.desc <> 0 THEN ii.name || ' DESC' ELSE ii.name END AS label " +
        "FROM pragma_index_xinfo(il.name) AS ii WHERE ii.key = 1 ORDER BY ii.seqno" +
        ")) AS columns " +
        "FROM pragma_index_list(" + sqlString(name) + ") AS il ORDER BY il.seq";
      const statements = await raw(sql, []);
      const rows = statements[0] && statements[0].results && statements[0].results.rows || [];
      return rows.map(function (row) {
        return {
          name: row[0] == null ? "" : String(row[0]),
          unique: Number(row[1]) === 1,
          origin: row[2] == null ? "" : String(row[2]),
          partial: Number(row[3]) === 1,
          columns: row[4] == null ? "" : String(row[4]),
        };
      });
    }

    function fillIndexSelect(select) {
      const current = select.dataset.value || "";
      setPickerOptions(select, state.indexColumns.map(function (column) {
        return { value: column.name, label: column.name };
      }), current);
    }

    async function refreshIndexColumns() {
      const name = document.getElementById("index-table").value;
      state.indexColumns = name ? await fetchColumns(name) : [];
      document.querySelectorAll("#index-columns .index-col").forEach(fillIndexSelect);
    }

    function addIndexColumn(focus) {
      const row = document.getElementById("index-column-row").content.firstElementChild.cloneNode(true);
      fillIndexSelect(row.querySelector(".index-col"));

        { value: "ASC", label: "ASC" },

      ], "ASC");
      row.querySelector(".remove").addEventListener("click", function () {
        if (document.querySelectorAll("#index-columns .index-row").length === 1) return;

      });
      document.getElementById("index-columns").append(row);
      if (focus) row.querySelector(".index-col [data-slot='select-trigger']").focus();

    async function openIndex(tableName) {
      const tables = state.tables.filter(function (table) { return table.type === "table"; });
      const select = document.getElementById("index-table");
      const preferred = tables.some(function (table) { return table.name === tableName; })
        ? tableName
        : (tables[0] ? tables[0].name : "");
      setPickerOptions(select, tables.map(function (table) {
        return { value: table.name, label: table.name };
      }), preferred);
      document.getElementById("index-name").value = "";
      document.getElementById("index-unique").checked = false;
      document.getElementById("index-columns").replaceChildren();
      document.getElementById("index-form").hidden = tables.length === 0;
      document.getElementById("index-empty").hidden = tables.length !== 0;
      setMode("index");
      if (!tables.length) return;
      await refreshIndexColumns();
      addIndexColumn(false);
    }

    function dropIndex(name) {
      const table = current();
      if (!table) return;
      if (!window.confirm("Drop index " + name + "?")) return;
      withBusy(async function () {
        await raw("DROP INDEX " + quoteIdent(name), []);
        state.mode = "structure";
        await showTable(table.name, state.offset);
      });
    }

    function renderPage(page) {
      const skip = new Set();
      state.hasRowid = page.hasRowid;
      state.rowids = [];
      let columns = page.columns;
      let rows = page.rows;
      if (page.hasRowid) {
        const index = columns.indexOf("__osd1_rowid");
        if (index !== -1) skip.add(index);
        rows.forEach(function (row) {
          state.rowids.push(index === -1 ? null : row[index]);
        });
      }
      const table = current();
      const canDelete = page.hasRowid && table && table.type === "table";
      const wrap = document.getElementById("grid-wrap");
      wrap.replaceChildren();
      wrap.append(grid(columns, rows, {
        skip: skip,
        onDelete: canDelete ? deleteRow : null,
      }));
      const pager = document.getElementById("pager");
      pager.replaceChildren();
      const from = rows.length ? state.offset + 1 : 0;
      const to = state.offset + rows.length;
      const label = document.createElement("span");
      label.className = "min-w-28 text-sm text-muted-foreground tabular-nums";
      if (!rows.length) label.textContent = "No rows.";
      else if (page.total == null) label.textContent = from + "\u2013" + to;
      else label.textContent = from + "\u2013" + to + " of " + page.total;
      const prev = document.createElement("button");
      prev.type = "button";
      prev.dataset.slot = "button";
      prev.dataset.variant = "outline";
      prev.dataset.size = "sm";
      prev.className = buttonClass("outline", "sm");
      prev.textContent = "Previous";
      prev.disabled = state.offset === 0;
      prev.addEventListener("click", function () { turn(-1); });
      const next = document.createElement("button");
      next.type = "button";
      next.dataset.slot = "button";
      next.dataset.variant = "outline";
      next.dataset.size = "sm";
      next.className = buttonClass("outline", "sm");
      next.textContent = "Next";
      const atEnd = rows.length < PAGE || (page.total != null && to >= page.total);
      next.disabled = atEnd;
      next.addEventListener("click", function () { turn(1); });
      pager.append(prev, label, next);
    }

    async function showTable(name, offset) {
      offset = offset || 0;
      const columns = await fetchColumns(name);
      let page = await fetchPage(name, offset);
      if (!page.rows.length && offset > 0) {
        offset = Math.max(0, offset - PAGE);
        page = await fetchPage(name, offset);
      }
      state.selected = name;
      state.offset = offset;
      state.columns = columns;
      const table = current();
      state.indexes = table && table.type === "table" ? await fetchIndexes(name) : [];
      document.getElementById("table-title").textContent = name;
      document.getElementById("table-kind").textContent = table ? table.type : "";
      document.getElementById("drop").textContent = table && table.type === "view" ? "Drop view" : "Drop table";
      renderInsert();
      renderStructure();
      renderPage(page);
      setMode(state.mode === "structure" ? "structure" : "rows");
    }

    function deleteRow(index) {
      const rowid = state.rowids[index];
      const table = current();
      if (!table || rowid == null) return;
      if (!window.confirm("Delete this row?")) return;
      withBusy(async function () {
        await raw("DELETE FROM " + quoteIdent(table.name) + " WHERE rowid = ?", [rowid]);
        await showTable(table.name, state.offset);
      });
    }

    function turn(direction) {
      if (!state.selected) return;
      const offset = Math.max(0, state.offset + direction * PAGE);
      withBusy(function () { return showTable(state.selected, offset); });
    }

    function wireColumn(row) {
      const box = row.querySelector(".col-pk");
      box.addEventListener("change", function () {
        if (!box.checked) return;
        document.querySelectorAll(".col-pk").forEach(function (other) {
          if (other !== box) other.checked = false;
        });
      });
      row.querySelector(".remove").addEventListener("click", function () {
        if (document.querySelectorAll("#create-columns .col-row").length === 1) return;
        row.remove();
      });
      bindTypeField(row.querySelector("[data-slot='combobox']"));
    }

    function addColumn(focus) {
      const row = document.getElementById("column-row").content.firstElementChild.cloneNode(true);
      wireColumn(row);
      document.getElementById("create-columns").append(row);
      if (focus) row.querySelector(".col-name").focus();
    }

    function resetCreateForm() {
      document.getElementById("create-name").value = "";
      document.getElementById("create-columns").replaceChildren();
      addColumn(false);
    }

    function renderSql(statements) {
      const host = document.getElementById("sql-results");
      host.replaceChildren();
      statements.forEach(function (statement, index) {
        const block = document.createElement("section");
        const heading = document.createElement("h3");
        heading.className = "mt-6 mb-3 text-sm font-medium first:mt-0";
        heading.textContent = "Statement " + (index + 1);
        block.append(heading);
        const results = statement.results || {};
        const columns = results.columns || [];
        const rows = results.rows || [];
        if (!columns.length) {
          const done = document.createElement("p");
          done.className = "text-sm text-muted-foreground";
          done.textContent = "Done.";
          block.append(done);
        } else {
          block.append(grid(columns, rows, null));
        }
        if (statement.meta && statement.meta.changes) {
          const changes = document.createElement("p");
          changes.className = "mt-2 text-sm text-muted-foreground";
          const n = statement.meta.changes;
          changes.textContent = n + (n === 1 ? " change" : " changes");
          block.append(changes);
        }
        host.append(block);
      });
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(String(value));
      return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
    }

    function statementRows(statements, index) {
      const statement = statements[index];
      return statement && statement.results && statement.results.rows || [];
    }

    // Parents sit to the left. A cycle contributes no extra depth.
    function graphDepths(names, edges) {
      const parents = {};
      names.forEach(function (name) { parents[name] = []; });
      edges.forEach(function (edge) {
        if (!edge.parent || edge.parent === edge.child) return;
        if (!parents[edge.child] || names.indexOf(edge.parent) === -1) return;
        if (parents[edge.child].indexOf(edge.parent) === -1) parents[edge.child].push(edge.parent);
      });
      const memo = {};
      function depth(name, stack) {
        if (Object.prototype.hasOwnProperty.call(memo, name)) return memo[name];
        if (stack.indexOf(name) !== -1) return 0;
        const list = parents[name] || [];
        if (!list.length) {
          memo[name] = 0;
          return 0;
        }
        stack.push(name);
        let value = 0;
        list.forEach(function (parent) {
          value = Math.max(value, 1 + depth(parent, stack));
        });
        stack.pop();
        memo[name] = value;
        return value;
      }
      const out = {};
      names.forEach(function (name) { out[name] = depth(name, []); });
      return out;
    }

    function edgeAction(edge) {
      const actions = [];
      if (edge.onDelete && edge.onDelete.toUpperCase() !== "NO ACTION") {
        actions.push("on delete " + edge.onDelete.toLowerCase());
      }
      if (edge.onUpdate && edge.onUpdate.toUpperCase() !== "NO ACTION") {
        actions.push("on update " + edge.onUpdate.toLowerCase());
      }
      return actions.join(" \u00b7 ");
    }

    function smoothStep(x1, y1, x2, y2) {
      const midX = (x1 + x2) / 2;
      const dy = Math.abs(y2 - y1);
      const rad = Math.min(8, dy / 2, Math.abs(midX - x1));
      if (dy < 2 || rad < 1) return "M " + x1 + " " + y1 + " H " + x2;
      const dirY = y2 > y1 ? 1 : -1;
      const dirX = x2 >= x1 ? 1 : -1;
      return "M " + x1 + " " + y1 +
        " H " + (midX - dirX * rad) +
        " Q " + midX + " " + y1 + " " + midX + " " + (y1 + dirY * rad) +
        " V " + (y2 - dirY * rad) +
        " Q " + midX + " " + y2 + " " + (midX + dirX * rad) + " " + y2 +
        " H " + x2;
    }

    function columnEl(board, table, column) {
      const tableSel = cssEscape(table);
      if (column) {
        const el = board.querySelector(
          '.fk-col[data-table="' + tableSel + '"][data-column="' + cssEscape(column) + '"]'
        );
        if (el) return el;
      }
      return board.querySelector('.fk-col[data-table="' + tableSel + '"][data-pk="1"]') ||
        board.querySelector('.fk-title[data-table="' + tableSel + '"]');
    }

    function drawEdges() {
      const board = document.getElementById("graph-board");
      const panel = document.getElementById("panel-graph");
      const edges = state.graphEdges || [];
      if (panel.hidden || !edges.length || !board.querySelector(".fk-card")) {
        const stale = board.querySelector("svg");
        if (stale) stale.remove();
        return;
      }
      const width = board.scrollWidth;
      const height = board.scrollHeight;
      const stamp = width + "x" + height + ":" + edges.length;
      const existing = board.querySelector("svg");
      if (existing && existing.getAttribute("data-stamp") === stamp) return;
      if (existing) existing.remove();

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "fk-svg");
      svg.style.position = "absolute";
      svg.style.top = "0";
      svg.style.left = "0";
      svg.style.overflow = "visible";
      svg.style.pointerEvents = "none";
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("data-stamp", stamp);
      const defs = document.createElementNS(svgNS, "defs");
      function addMarker(id, points, width) {
        const marker = document.createElementNS(svgNS, "marker");
        marker.setAttribute("id", id);
        marker.setAttribute("viewBox", "-10 -10 20 20");
        marker.setAttribute("refX", "0");
        marker.setAttribute("refY", "0");
        marker.setAttribute("markerWidth", "16");
        marker.setAttribute("markerHeight", "16");
        marker.setAttribute("orient", "auto-start-reverse");
        const shape = document.createElementNS(svgNS, "polyline");
        shape.setAttribute("points", points);
        shape.setAttribute("fill", "none");
        shape.setAttribute("stroke", "currentColor");
        shape.setAttribute("stroke-width", width);
        shape.setAttribute("stroke-linecap", "square");
        shape.setAttribute("stroke-linejoin", "round");
        marker.append(shape);
        defs.append(marker);
      }
      addMarker("fk-one", "-10,-8 -10,8", "3");
      addMarker("fk-many", "0,-8 -10,0 0,8", "1.5");
      svg.append(defs);
      board.prepend(svg);

      const boardRect = board.getBoundingClientRect();
      function point(el, side) {
        const handle = el.querySelector(".fk-handle." + side);
        const rect = (handle || el).getBoundingClientRect();
        return {
          x: (handle ? rect.left + rect.width / 2 : (side === "left" ? rect.left : rect.right)) - boardRect.left,
          y: rect.top + rect.height / 2 - boardRect.top,
        };
      }

      edges.forEach(function (edge) {
        const fromEl = columnEl(board, edge.child, edge.from);
        const toEl = columnEl(board, edge.parent, edge.to);
        if (!fromEl || !toEl) return;
        const same = fromEl.closest(".fk-card") === toEl.closest(".fk-card");
        const start = point(toEl, "right");
        const end = point(fromEl, same ? "right" : "left");
        let d;
        if (same) {
          const bow = 40;
          const x = Math.max(start.x, end.x) + bow;
          d = "M " + start.x + " " + start.y + " C " + x + " " + start.y + ", " + x + " " + end.y + ", " + end.x + " " + end.y;
        } else {
          d = smoothStep(start.x, start.y, end.x, end.y);
        }
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("class", "fk-edge");
        path.setAttribute("d", d);
        path.setAttribute("marker-start", "url(#fk-one)");
        path.setAttribute("marker-end", edge.oneToOne ? "url(#fk-one)" : "url(#fk-many)");
        svg.append(path);
        const action = edgeAction(edge);
        if (!action) return;
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", String((start.x + end.x) / 2));
        text.setAttribute("y", String(Math.min(start.y, end.y) - 18));
        text.setAttribute("text-anchor", "middle");
        text.textContent = action;
        svg.append(text);
        const box = text.getBBox();
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("class", "fk-label-bg");
        rect.setAttribute("x", String(box.x - 4));
        rect.setAttribute("y", String(box.y - 1));
        rect.setAttribute("width", String(box.width + 8));
        rect.setAttribute("height", String(box.height + 2));
        rect.setAttribute("rx", "4");
        svg.insertBefore(rect, text);
      });
    }

    async function renderGraph() {
      const statements = await raw(GRAPH_SQL, []);
      const colRows = statementRows(statements, 0);
      const fkRows = statementRows(statements, 1);
      const tables = [];
      const byName = {};
      colRows.forEach(function (row) {
        const name = String(row[0]);
        if (!byName[name]) {
          byName[name] = { name: name, columns: [] };
          tables.push(byName[name]);
        }
        byName[name].columns.push({
          name: row[2] == null ? "" : String(row[2]),
          type: row[3] == null ? "" : String(row[3]),
          pk: Number(row[4]) > 0,
          dflt: row[5] == null ? "" : String(row[5]),
        });
      });
      function pkName(table) {
        const found = byName[table];
        if (!found) return "";
        const column = found.columns.find(function (item) { return item.pk; });
        return column ? column.name : "";
      }
      const edges = fkRows.map(function (row) {
        const child = String(row[0]);
        const from = row[3] == null ? "" : String(row[3]);
        const parent = row[4] == null ? "" : String(row[4]);
        const to = row[5] == null || row[5] === "" ? pkName(parent) : String(row[5]);
        const childCols = byName[child] ? byName[child].columns : [];
        const pkColumns = childCols.filter(function (column) { return column.pk; });
        return {
          child: child,
          from: from,
          parent: parent,
          to: to,
          onUpdate: row[6] == null ? "" : String(row[6]),
          onDelete: row[7] == null ? "" : String(row[7]),
          oneToOne: pkColumns.length === 1 && pkColumns[0].name === from,
        };
      });
      const handles = {};
      function addHandle(table, column, side) {
        if (!table || !column) return;
        const key = table + "\0" + column;
        if (!handles[key]) handles[key] = {};
        handles[key][side] = true;
      }
      edges.forEach(function (edge) {
        const same = edge.parent === edge.child;
        addHandle(edge.child, edge.from, same ? "right" : "left");
        addHandle(edge.parent, edge.to, "right");
      });
      const board = document.getElementById("graph-board");
      board.replaceChildren();
      state.graphEdges = edges;
      if (!tables.length) {
        const note = document.createElement("p");
        note.className = "p-6 text-sm text-muted-foreground";
        note.textContent = "No tables yet.";
        board.append(note);
        return;
      }
      const names = tables.map(function (table) { return table.name; });
      const depthOf = graphDepths(names, edges);
      let maxDepth = 0;
      names.forEach(function (name) { maxDepth = Math.max(maxDepth, depthOf[name]); });
      const columns = [];
      for (let depth = 0; depth <= maxDepth; depth += 1) columns.push([]);
      tables.forEach(function (table) { columns[depthOf[table.name]].push(table); });
      const cols = document.createElement("div");
      cols.className = "fk-cols";
      columns.forEach(function (list) {
        if (!list.length) return;
        list.sort(function (a, b) {
          if (a.name < b.name) return -1;
          if (a.name > b.name) return 1;
          return 0;
        });
        const stack = document.createElement("div");
        stack.className = "fk-stack";
        list.forEach(function (table) {
          const card = document.createElement("div");
          card.dataset.slot = "card";
          card.className = "fk-card relative flex w-72 cursor-pointer flex-col gap-0 overflow-visible rounded-xl border bg-card py-0 text-left text-card-foreground shadow-sm outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("data-table", table.name);
          const title = document.createElement("div");
          title.dataset.slot = "card-title";
          title.className = "fk-title border-b px-4 py-3 leading-none font-semibold";
          title.setAttribute("data-table", table.name);
          title.textContent = table.name;
          const grid = document.createElement("table");
          grid.dataset.slot = "table";
          grid.className = "w-full text-sm";
          const body = document.createElement("tbody");
          table.columns.forEach(function (column) {
            const row = document.createElement("tr");
            row.dataset.slot = "table-row";
            row.className = "fk-col border-b last:border-b-0";
            row.setAttribute("data-table", table.name);
            row.setAttribute("data-column", column.name);
            if (column.pk) row.setAttribute("data-pk", "1");
            const sides = handles[table.name + "\0" + column.name] || {};
            const name = document.createElement("td");
            name.dataset.slot = "table-cell";
            name.className = "fk-name relative p-2 align-middle font-mono text-xs font-medium";
            name.textContent = column.name;
            if (sides.left) {
              const handle = document.createElement("span");
              handle.className = "fk-handle left";
              name.append(handle);
            }
            const type = document.createElement("td");
            type.dataset.slot = "table-cell";
            type.className = "fk-type p-2 align-middle font-mono text-xs text-muted-foreground";
            type.textContent = column.type;
            const extra = document.createElement("td");
            extra.dataset.slot = "table-cell";
            extra.className = "fk-extra relative p-2 text-right align-middle font-mono text-xs text-muted-foreground";
            const dflt = document.createElement("span");
            dflt.className = "block max-w-20 truncate";
            dflt.textContent = column.dflt;
            extra.append(dflt);
            if (sides.right) {
              const handle = document.createElement("span");
              handle.className = "fk-handle right";
              extra.append(handle);
            }
            row.append(name, type, extra);
            body.append(row);
          });
          grid.append(body);
          card.append(title, grid);
          function openCard() {
            state.mode = "rows";
            withBusy(function () { return showTable(table.name, 0); });
          }
          card.addEventListener("click", openCard);
          card.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            openCard();
          });
          stack.append(card);
        });
        cols.append(stack);
      });
      board.append(cols);
      drawEdges();
    }

    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      setLoginError("");
      state.token = document.getElementById("token").value;
      withBusy(async function () {
        await raw("SELECT 1", []);
        storageSet("osd1.signedIn", "1");
        storageSet("osd1.token", state.token);
        showApp();
        await loadTables();
        if (!state.selected) setMode("empty");
      });
    });

    document.getElementById("sign-out").addEventListener("click", function () {
      storageRemove("osd1.signedIn");
      storageRemove("osd1.token");
      state.token = "";
      state.primary = null;
      document.getElementById("token").value = "";
      showLogin();
    });

    document.getElementById("table-list").addEventListener("click", function (event) {
      const button = event.target.closest("button");
      if (!button) return;
      const name = button.getAttribute("data-name");
      if (!name) return;
      state.mode = "rows";
      withBusy(function () { return showTable(name, 0); });
    });

    document.getElementById("new-table").addEventListener("click", function () {
      setMode("create");
    });

    document.getElementById("new-index").addEventListener("click", function () {
      withBusy(function () { return openIndex(state.selected); });
    });

    document.getElementById("index-table").addEventListener("change", function () {
      withBusy(refreshIndexColumns);
    });

    document.getElementById("add-index-column").addEventListener("click", function () {
      addIndexColumn(true);
    });

    document.getElementById("index-form").addEventListener("submit", function (event) {
      event.preventDefault();
      withBusy(async function () {
        const table = document.getElementById("index-table").value;
        if (!table) throw new Error("Create a table first.");
        const indexName = document.getElementById("index-name").value.trim();
        const unique = document.getElementById("index-unique").checked;
        const rows = document.querySelectorAll("#index-columns .index-row");
        if (!rows.length) throw new Error("Add a column.");
        const seen = {};
        const parts = [];
        rows.forEach(function (row) {
          const col = row.querySelector(".index-col").value;
          if (!state.indexColumns.some(function (column) { return column.name === col; })) {
            throw new Error("Choose a column from the table.");
          }
          if (seen[col]) throw new Error("That column is already in the index.");
          seen[col] = true;
          const order = row.querySelector(".index-order").value === "DESC" ? "DESC" : "ASC";
          parts.push(quoteIdent(col) + " " + order);
        });
        await raw(
          "CREATE " + (unique ? "UNIQUE " : "") + "INDEX " + userIdent(indexName) +
            " ON " + quoteIdent(table) + " (" + parts.join(", ") + ")",
          []
        );
        state.mode = "structure";
        await showTable(table, 0);
      });
    });

    document.getElementById("refresh").addEventListener("click", function () {
      withBusy(async function () {
        await loadTables();
        if (state.mode === "graph") {
          await renderGraph();
          return;
        }
        if (state.selected && (state.mode === "rows" || state.mode === "structure")) {
          await showTable(state.selected, state.offset);
        }
      });
    });

    document.getElementById("show-rows").addEventListener("click", function () {
      if (state.selected) setMode("rows");
    });

    document.getElementById("show-structure").addEventListener("click", function () {
      if (state.selected) setMode("structure");
    });

    document.getElementById("drop").addEventListener("click", function () {
      const table = current();
      if (!table) return;
      const verb = table.type === "view" ? "VIEW" : "TABLE";
      if (!window.confirm("Drop " + table.type + " " + table.name + "?")) return;
      withBusy(async function () {
        await raw("DROP " + verb + " " + quoteIdent(table.name), []);
        state.selected = null;
        await loadTables();
        setMode("empty");
      });
    });

    document.getElementById("insert-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const table = current();
      if (!table || !state.columns.length) return;
      const inputs = event.currentTarget.querySelectorAll("input");
      withBusy(async function () {
        const names = [];
        const params = [];
        state.columns.forEach(function (column, index) {
          names.push(quoteIdent(column.name));
          params.push(bindValue(inputs[index].value, column.type));
        });
        const marks = params.map(function () { return "?"; }).join(", ");
        await raw(
          "INSERT INTO " + quoteIdent(table.name) + " (" + names.join(", ") + ") VALUES (" + marks + ")",
          params
        );
        inputs.forEach(function (input) { input.value = ""; });
        await showTable(table.name, state.offset);
      });
    });

    document.getElementById("create-form").addEventListener("submit", function (event) {
      event.preventDefault();
      withBusy(async function () {
        const name = document.getElementById("create-name").value.trim();
        const rows = document.querySelectorAll("#create-columns .col-row");
        if (!rows.length) throw new Error("Add a column.");
        const defs = [];
        let keys = 0;
        rows.forEach(function (row) {
          const colName = row.querySelector(".col-name").value.trim();
          const type = columnType(row.querySelector(".col-type").value);
          const pk = row.querySelector(".col-pk").checked;
          if (pk) keys += 1;
          defs.push(userIdent(colName) + (type ? " " + type : "") + (pk ? " PRIMARY KEY" : ""));
        });
        if (keys > 1) throw new Error("Choose one primary key.");
        await raw("CREATE TABLE " + userIdent(name) + " (" + defs.join(", ") + ")", []);
        resetCreateForm();
        await loadTables();
        state.mode = "rows";
        await showTable(name, 0);
      });
    });

    document.getElementById("add-column").addEventListener("click", function () {
      addColumn(true);
    });

    document.getElementById("sql-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const sql = document.getElementById("sql").value;
      withBusy(async function () {
        const statements = await raw(sql, []);
        renderSql(statements);
        await loadTables();
      });
    });

    document.getElementById("sql").addEventListener("keydown", function (event) {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        document.getElementById("sql-form").requestSubmit();
      }
    });

    document.getElementById("sql-tab").addEventListener("click", function () {
      setMode("sql");
    });

    document.getElementById("graph-tab").addEventListener("click", function () {
      withBusy(async function () {
        setMode("graph");
        await renderGraph();
      });
    });

    document.addEventListener("click", function (event) {
      closePickers();
      closeTypeMenus(event.target.closest("[data-slot='combobox']"));
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closePickers();
        closeTypeMenus();
      }
    });
    document.getElementById("main").addEventListener("scroll", function (event) {
      const target = event.target;
      if (target && target.closest && target.closest("[data-slot='combobox-content']")) return;
      closePickers();
      closeTypeMenus();
    }, true);
    bindPicker(document.getElementById("index-table"));

    const graphBoard = document.getElementById("graph-board");
    if (window.ResizeObserver && graphBoard) {
      let graphQueued = false;
      const graphObserver = new ResizeObserver(function () {
        if (graphQueued || state.mode !== "graph") return;
        graphQueued = true;
        requestAnimationFrame(function () {
          graphQueued = false;
          if (state.mode === "graph") drawEdges();
        });
      });
      graphObserver.observe(graphBoard);
    }

    resetCreateForm();
    document.getElementById("token").value = storageGet("osd1.token") || "";
    if (storageGet("osd1.signedIn") === "1") {
      state.token = document.getElementById("token").value;
      withBusy(async function () {
        await raw("SELECT 1", []);
        showApp();
        await loadTables();
        setMode("empty");
      });
    } else {
      showLogin();
    }
  </script>
</body>
</html>
