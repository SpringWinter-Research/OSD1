[package]
name = "osd1-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "osd1_server"
path = "src/lib.rs"

[[bin]]
name = "osd1"
path = "src/main.rs"

[dependencies]
osd1-engine = { workspace = true }
osd1-http = { workspace = true }
osd1-raft = { workspace = true }
osd1-types = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
osd1-engine = { workspace = true }
osd1-http = { workspace = true }
osd1-raft = { workspace = true }
osd1-types = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros"] }
