apiVersion: v1
kind: Service
metadata:
  name: {{ include "osd1.headless" . }}
  labels:
    {{- include "osd1.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "osd1.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if .Values.raft.enabled }}
    - name: raft
      port: {{ .Values.raft.port }}
      targetPort: raft
      protocol: TCP
    {{- end }}
