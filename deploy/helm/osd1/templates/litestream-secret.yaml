{{- if and .Values.litestream.enabled (not .Values.litestream.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osd1.litestreamSecret" . }}
  labels:
    {{- include "osd1.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.litestream.accessKeyId | quote }}
  secret-access-key: {{ .Values.litestream.secretAccessKey | quote }}
{{- end }}
