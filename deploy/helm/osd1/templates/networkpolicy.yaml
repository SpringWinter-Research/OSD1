{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "osd1.fullname" . }}
  labels:
    {{- include "osd1.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "osd1.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.raft.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "osd1.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.raft.port }}
          protocol: TCP
    {{- end }}
{{- end }}
