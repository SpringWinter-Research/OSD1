{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osd1.fullname" . }}
  labels:
    {{- include "osd1.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | quote }}
  {{- if and .Values.raft.enabled (not .Values.raft.existingSecret) }}
  {{ .Values.raft.secretKey }}: {{ .Values.raft.secret | quote }}
  {{- end }}
{{- end }}
