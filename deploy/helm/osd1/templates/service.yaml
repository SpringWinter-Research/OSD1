apiVersion: v1
kind: Service
metadata:
  name: {{ include "osd1.fullname" . }}
  labels:
    {{- include "osd1.labels" . | nindent 4 }}
    osd1.io/scrape: "true"
  {{- if .Values.metrics.annotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "osd1.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
