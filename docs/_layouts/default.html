<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% if page.name == "index.md" %}OSD1 Documentation{% elsif page.title %}{{ page.title }} · OSD1 Documentation{% else %}OSD1 Documentation{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <meta property="og:title" content="{% if page.name == 'index.md' %}OSD1 Documentation{% else %}{{ page.title | default: site.title | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.name == 'index.md' %}OSD1 Documentation{% else %}{{ page.title | default: site.title | escape }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="OSD1 documentation. One SQLite database behind an HTTP API.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/osd1.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/docs-shell.css' | relative_url }}">
  </head>
  <body>
    <a class="docs-skip" href="#content">Skip to content</a>
    <header class="docs-top">
      <button type="button" class="docs-menu-button" id="docs-menu-button" aria-expanded="false" aria-controls="docs-sidebar">Docs</button>
      <a class="docs-brand" href="{{ '/' | relative_url }}">OSD1</a>
      <span class="docs-brand-label">Documentation</span>
      <a class="docs-source" href="https://github.com/SpringWinter-Research/OSD1">Source</a>
    </header>
    <div class="docs-shell">
      {% include sidebar.html %}
      <main id="content" class="docs-article">
        {{ content }}
      </main>
      <aside class="docs-toc" aria-label="On this page">
        <p class="docs-toc-label">On this page</p>
        <nav id="docs-toc"></nav>
      </aside>
    </div>
    <footer class="docs-footer">
      <p>OSD1. <a href="https://github.com/SpringWinter-Research/OSD1/blob/main/LICENSE">MIT license</a>. <a href="https://github.com/SpringWinter-Research/OSD1">Source</a>.</p>
    </footer>
    <script>
      (function () {
        var button = document.getElementById("docs-menu-button");
        var sidebar = document.getElementById("docs-sidebar");
        if (button && sidebar) {
          button.addEventListener("click", function () {
            var open = !sidebar.classList.contains("is-open");
            sidebar.classList.toggle("is-open", open);
            button.setAttribute("aria-expanded", open ? "true" : "false");
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && sidebar.classList.contains("is-open")) {
              sidebar.classList.remove("is-open");
              button.setAttribute("aria-expanded", "false");
              button.focus();
            }
          });
        }

        var article = document.querySelector(".docs-article");
        var toc = document.getElementById("docs-toc");
        var aside = document.querySelector(".docs-toc");
        if (!article || !toc) return;
        var heads = article.querySelectorAll("h2, h3");
        if (heads.length < 2) {
          if (aside) aside.hidden = true;
          return;
        }
        var list = document.createElement("ol");
        heads.forEach(function (heading) {
          if (!heading.id) return;
          var item = document.createElement("li");
          if (heading.tagName === "H3") item.className = "docs-toc-sub";
          var link = document.createElement("a");
          link.href = "#" + heading.id;
          link.textContent = heading.textContent;
          item.appendChild(link);
          list.appendChild(item);
        });
        toc.appendChild(list);
      })();
    </script>
    <script type="module">
      async function drawMermaid() {
        var blocks = Array.from(document.querySelectorAll(".language-mermaid"));
        document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
          if (!code.closest(".language-mermaid")) blocks.push(code.parentElement);
        });
        if (!blocks.length) return;
        var mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs")).default;
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: "neutral",
          fontFamily: "Source Sans 3, sans-serif"
        });
        for (var i = 0; i < blocks.length; i++) {
          var block = blocks[i];
          var source = block.textContent;
          if (!source || !source.trim()) continue;
          try {
            var drawn = await mermaid.render("osd1m" + i, source);
            var holder = document.createElement("div");
            holder.className = "docs-mermaid";
            holder.innerHTML = drawn.svg;
            block.replaceWith(holder);
          } catch (renderError) {
            /* Leave this fence as source. */
          }
        }
      }
      drawMermaid().catch(function () {
        /* Leave every fence as source when the renderer cannot load. */
      });
    </script>
  </body>
</html>
