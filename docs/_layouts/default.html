<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · OSD1{% else %}OSD1{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="OSD1. The database is a file. 111,075 requests per second at 32 clients on an Apple M4.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/osd1.css' | relative_url }}">
  </head>
  <body>
    {% include nav.html %}
    <main class="wrap">
      {{ content }}
    </main>
    <footer class="site-foot">
      <div class="wrap foot-row">
        <span>OSD1</span>
        <a href="https://github.com/SpringWinter-Research/OSD1/blob/main/LICENSE">MIT</a>
        <a href="https://github.com/SpringWinter-Research/OSD1">Source</a>
      </div>
    </footer>
  </body>
</html>
